<!-- Stage 1, the rooftop searchlight housing, flare and lens. -->
<g class="bat-stage-source" id="batStageSource">
<path d="M-20,483 L-14,504 L14,504 L20,483 Z" fill="#1b1d24" stroke="#d4af37" stroke-width="1.5"/>
<ellipse cx="0" cy="483" rx="34" ry="20" fill="url(#flareGrad)"/>
