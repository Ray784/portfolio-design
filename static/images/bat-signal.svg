<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" role="img" aria-label="Bat-Signal projected into the night sky">
<defs>
<linearGradient id="beamGrad" gradientUnits="userSpaceOnUse" x1="0" y1="483" x2="0" y2="0">
<stop offset="0" stop-color="rgb(245, 197, 66)" stop-opacity="0.58"/>
<stop offset="1" stop-color="rgb(245, 197, 66)" stop-opacity="0.12"/>
</linearGradient>
<linearGradient id="beamCore" gradientUnits="userSpaceOnUse" x1="0" y1="483" x2="0" y2="0">
<stop offset="0" stop-color="rgb(255, 236, 170)" stop-opacity="0.26"/>
<stop offset="1" stop-color="rgb(245, 197, 66)" stop-opacity="0.10"/>
</linearGradient>
<radialGradient id="spotGrad" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#fff1b8" stop-opacity="0.58"/>
<stop offset="0.7" stop-color="#f5c542" stop-opacity="0.48"/>
<stop offset="1" stop-color="#d4af37" stop-opacity="0.36"/>
</radialGradient>
<radialGradient id="haloGrad" cx="0.5" cy="0.5" r="0.5">
<stop offset="0.55" stop-color="#f5c542" stop-opacity="0.22"/>
<stop offset="1" stop-color="#f5c542" stop-opacity="0"/>
</radialGradient>
<radialGradient id="flareGrad" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
<stop offset="0.35" stop-color="#fff1b8" stop-opacity="0.85"/>
<stop offset="1" stop-color="#f5c542" stop-opacity="0"/>
</radialGradient>
<linearGradient id="shadowRayGrad" gradientUnits="userSpaceOnUse" x1="0" y1="483" x2="0" y2="0">
<stop offset="0" stop-color="#08090c" stop-opacity="0.18"/>
<stop offset="1" stop-color="#08090c" stop-opacity="0.32"/>
</linearGradient>
<radialGradient id="skyHaloGrad" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#f5c542" stop-opacity="0.14"/>
<stop offset="1" stop-color="#f5c542" stop-opacity="0"/>
</radialGradient>
</defs>
<!-- Coaxial projection frame: origin is the cloud spotlight center and +y runs down the beam to the rooftop lens. -->
<g id="batSignalProjection" transform="translate(320 225) rotate(31.88)" opacity="0.48">
<!-- Stage 2, the volumetric beam shooting up from the lens. -->
<g class="bat-stage-beam" id="batStageBeam">
<polygon points="-16,483 16,483 144.2,8.5 -144.2,8.5" fill="url(#beamGrad)"/>
<polygon points="-10,483 10,483 108,6 -108,6" fill="url(#beamCore)"/>
<path d="M-6,483 L6,483 L78,6 L-78,6 Z" fill="url(#shadowRayGrad)"/>
</g>
<!-- Stage 3, the cloud glow, spotlight disc and foreshortened emblem. -->
<g class="bat-stage-signal" id="batStageSignal">
<ellipse cx="0" cy="0" rx="210" ry="125" fill="url(#skyHaloGrad)"/>
<ellipse cx="0" cy="0" rx="185" ry="102" fill="url(#haloGrad)"/>
<ellipse cx="0" cy="0" rx="145" ry="76" fill="url(#spotGrad)"/>
<g transform="translate(-102 -28.5) scale(0.34 0.21)">
